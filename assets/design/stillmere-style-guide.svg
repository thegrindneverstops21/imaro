<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#F6F3ED" rx="0" stroke="none"/><text x="80" y="90" font-family="Georgia" font-size="35" font-weight="400" fill="#16324F">STILLMERE HOTEL</text><text x="80" y="165" font-family="Arial" font-size="60" font-weight="700" fill="#16324F">UI concept / Style guide</text><text x="80" y="214" font-family="Arial" font-size="25" font-weight="400" fill="#475569">A place to settle in.  •  One property, one booking journey.</text><path d="M80 252h1760" stroke="#CBD5E1"/><rect x="80" y="294" width="265" height="108" fill="#16324F" rx="8" stroke="#CBD5E1"/><text x="80" y="438" font-family="Arial" font-size="24" font-weight="700" fill="#16324F">Navy</text><text x="80" y="472" font-family="Arial" font-size="22" font-weight="400" fill="#475569">#16324F</text><rect x="375" y="294" width="265" height="108" fill="#2563EB" rx="8" stroke="#CBD5E1"/><text x="375" y="438" font-family="Arial" font-size="24" font-weight="700" fill="#16324F">Action blue</text><text x="375" y="472" font-family="Arial" font-size="22" font-weight="400" fill="#475569">#2563EB</text><rect x="670" y="294" width="265" height="108" fill="#EFF6FF" rx="8" stroke="#CBD5E1"/><text x="670" y="438" font-family="Arial" font-size="24" font-weight="700" fill="#16324F">Pale blue</text><text x="670" y="472" font-family="Arial" font-size="22" font-weight="400" fill="#475569">#EFF6FF</text><rect x="965" y="294" width="265" height="108" fill="#FFFFFF" rx="8" stroke="#CBD5E1"/><text x="965" y="438" font-family="Arial" font-size="24" font-weight="700" fill="#16324F">White</text><text x="965" y="472" font-family="Arial" font-size="22" font-weight="400" fill="#475569">#FFFFFF</text><rect x="1260" y="294" width="265" height="108" fill="#475569" rx="8" stroke="#CBD5E1"/><text x="1260" y="438" font-family="Arial" font-size="24" font-weight="700" fill="#16324F">Slate</text><text x="1260" y="472" font-family="Arial" font-size="22" font-weight="400" fill="#475569">#475569</text><rect x="1555" y="294" width="265" height="108" fill="#F6F3ED" rx="8" stroke="#CBD5E1"/><text x="1555" y="438" font-family="Arial" font-size="24" font-weight="700" fill="#16324F">Ivory</text><text x="1555" y="472" font-family="Arial" font-size="22" font-weight="400" fill="#475569">#F6F3ED</text><text x="80" y="555" font-family="Arial" font-size="19" font-weight="700" fill="#16324F">TYPE</text><text x="80" y="614" font-family="Arial" font-size="37" font-weight="700" fill="#16324F">Inter / UI sans-serif</text><text x="80" y="657" font-family="Arial" font-size="32" font-weight="700" fill="#16324F">Classic Room</text><text x="80" y="702" font-family="Arial" font-size="25" font-weight="400" fill="#16324F">R1 250 per night, all-in</text><text x="80" y="741" font-family="Arial" font-size="23" font-weight="400" fill="#475569">Readable labels and familiar actions.</text><text x="80" y="792" font-family="Georgia" font-size="24" font-weight="400" fill="#16324F">Display option: Cormorant Garamond</text><text x="80" y="838" font-family="Georgia" font-size="38" font-weight="400" fill="#16324F">A place to settle in.</text><text x="720" y="555" font-family="Arial" font-size="19" font-weight="700" fill="#16324F">COMPONENTS &amp; CONTENT</text><rect x="720" y="585" width="410" height="65" fill="#2563EB" rx="10" stroke="none"/><text x="819" y="626" font-family="Arial" font-size="25" font-weight="700" fill="white">Book this room</text><text x="720" y="705" font-family="Arial" font-size="23" font-weight="400" fill="#475569">Top-level: menu. Booking steps: back.</text><text x="720" y="746" font-family="Arial" font-size="23" font-weight="400" fill="#475569">44 px minimum touch targets.</text><text x="720" y="787" font-family="Arial" font-size="23" font-weight="400" fill="#475569">R1 250 · Deluxe Room · Fees included</text><text x="720" y="828" font-family="Arial" font-size="23" font-weight="400" fill="#475569">Body and labels: Slate #475569.</text><text x="1320" y="555" font-family="Arial" font-size="19" font-weight="700" fill="#16324F">IMAGERY &amp; LAUNCH CHECKS</text><text x="1320" y="607" font-family="Arial" font-size="23" font-weight="400" fill="#475569">Use one approved photo per room.</text><text x="1320" y="648" font-family="Arial" font-size="23" font-weight="400" fill="#475569">Linen · warm oak · natural daylight.</text><text x="1320" y="689" font-family="Arial" font-size="23" font-weight="400" fill="#475569">Keep the same image across steps.</text><text x="1320" y="751" font-family="Arial" font-size="22" font-weight="400" fill="#475569">Confirm property address and contact.</text><text x="1320" y="790" font-family="Arial" font-size="22" font-weight="400" fill="#475569">Connect verified guest reviews.</text><text x="1320" y="829" font-family="Arial" font-size="22" font-weight="400" fill="#475569">Approve benefits, VAT and rate policy.</text><text x="1320" y="868" font-family="Arial" font-size="22" font-weight="400" fill="#475569">Connect secure payments and availability.</text><path d="M80 930h1760" stroke="#CBD5E1"/><text x="80" y="978" font-family="Arial" font-size="22" font-weight="400" fill="#475569">Concept only: illustrative rates, policies and generated photography. Mockup type uses Arial / Georgia fallbacks.</text><text x="80" y="1018" font-family="Arial" font-size="24" font-weight="700" fill="#16324F">Flow: Home → Rooms → Room details → Guest &amp; payment → Review &amp; book</text></svg>