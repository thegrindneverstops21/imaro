<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16324f" />
    <title>Imaro Hotel — A place to settle in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- React mounts the whole app inside this empty container. -->
    <div id="root"></div>
    <script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { MemoryRouter } from 'react-router-dom';
import { Provider } from 'react-redux';
import { store, setUser } from '/src/app/store.ts';
import { App } from '/src/app/App.tsx';
import '/src/styles/global.css';
import '/src/styles/account.css';
import '/src/styles/guest.css';
import '/src/styles/staff.css';
const params=new URLSearchParams(location.search);
const mode=params.get('page')||'review';
const state=params.get('state')||'held';
const person={id:999,name:'Preview Staff',email:'preview@example.com',role:mode==='admin'?'admin':'guest'};
if(['admin','account'].includes(mode))setTimeout(()=>store.dispatch(setUser(person)),200);
const branch={id:1,slug:'polokwane',name:'Imaro Polokwane',city:'Polokwane',description:'Preview property',isPublished:true};
const booking={reference:'IM-UI-TEST',status:state,paymentStatus:['pending_approval','confirmed'].includes(state)?'paid':state==='cancelled'?'refunded':'unpaid',amountPaid:0,balanceDue:3750,totalAmount:3750,vatIncluded:489.13,branch,checkIn:'2026-11-06',checkOut:'2026-11-09',nights:3,guests:2,holdExpiresAt:'2026-11-05T10:00:00Z',guest:{name:'Preview Guest',email:'preview@example.com',phone:'+27000000000'},rooms:[{roomType:'Classic Room',rooms:1,pricePerNight:1250}],cancellation:null};
const response=data=>new Response(JSON.stringify({data}),{status:200,headers:{'Content-Type':'application/json'}});
window.fetch=async(url,options={})=>{
 if(options.method&&options.method!=='GET')throw new Error('Preview only: all writes are blocked.');
 const route=new URL(String(url),location.origin),path=route.pathname;
 if(path.endsWith('/admin/bookings'))return response(Array.from({length:route.searchParams.get('search')?1:26},(_,i)=>({...booking,reference:'IM-UI-'+(i+1),guestName:'Preview Guest '+(i+1),guestEmail:'preview@example.com',branchName:branch.name,createdAt:'2026-11-05T09:00:00Z',status:route.searchParams.get('status')||'pending_approval',paymentStatus:'paid',amountPaid:3750,balanceDue:0})));
 if(path.endsWith('/admin/branches'))return response([branch]);
 if(path.endsWith('/rooms'))return response([{id:1,roomTypeId:1,roomType:'Classic Room',roomNumber:'101',status:'active'},{id:2,roomTypeId:1,roomType:'Classic Room',roomNumber:'102',status:'maintenance'}]);
 if(path.endsWith('/prices'))return response([{roomTypeId:1,roomType:'classic',name:'Classic Room',pricePerNight:1250}]);
 if(path.endsWith('/me/bookings'))return response([booking]);
 if(path.endsWith('/me/favourites')||path.endsWith('/me/notifications'))return response([]);
 if(path.endsWith('/me'))return response(person);
 if(path.includes('/bookings/'))return response(booking);
 throw new Error('Fixture endpoint unavailable');
};
const notice=document.createElement('p');notice.textContent='UI test fixture — synthetic records; all writes blocked.';notice.style.cssText='margin:0;padding:20px 5%;font:16px "Source Sans 3",sans-serif';document.body.prepend(notice);
const paths={admin:'/admin',account:'/profile',manage:'/booking/IM-UI-TEST',confirmation:'/confirmation/IM-UI-TEST',return:'/payment/return?reference=IM-UI-TEST',review:'/review/IM-UI-TEST'};
createRoot(document.getElementById('root')).render(React.createElement(Provider,{store},React.createElement(MemoryRouter,{initialEntries:[paths[mode]]},React.createElement(App))));
</script>
  </body>
</html>
